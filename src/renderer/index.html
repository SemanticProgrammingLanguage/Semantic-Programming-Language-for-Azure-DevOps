<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Semantic source preview</title>
  <style>
    html,body{margin:0;padding:0;background:transparent;color:inherit;font-family:Consolas,"Cascadia Code",monospace}
    #semantic-viewer{box-sizing:border-box;min-height:100%;padding:16px;white-space:pre;overflow:auto;font-size:13px;line-height:1.55;tab-size:4}
    .sem-comment{opacity:.72;font-style:italic}
    .sem-keyword{font-weight:700}
    .sem-string{color:#ce9178}
    .sem-number{color:#b5cea8}
    .sem-constant{color:#569cd6}
    .sem-reference{color:#4ec9b0}
    .sem-field{color:#9cdcfe}
    .sem-operator{font-weight:700}
    .sem-punctuation{opacity:.9}
    @media (prefers-color-scheme: light){
      .sem-string{color:#a31515}.sem-number{color:#098658}.sem-constant{color:#0000ff}.sem-reference{color:#267f99}.sem-field{color:#001080}
    }
  </style>
</head>
<body>
  <pre id="semantic-viewer" aria-label="Semantic source preview"></pre>
  <script src="index.js"></script>
</body>
</html>
